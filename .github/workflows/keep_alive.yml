name: Render Backend Keep-Alive Cron

on:
  schedule:
    # Runs every 10 minutes from 08:00 AM to 01:00 AM IST (02:00 to 19:50 UTC)
    # Active 17–18 hours daily (~552 hours/month), staying well under Render's 750 free hours/month limit
    - cron: '*/10 2-19 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping-render:
    name: Ping Render Backend
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          TARGET_URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://prakriti-ai-jgsn.onrender.com"
          fi
          echo "Pinging Render backend health check at: $TARGET_URL/health"
          curl -s -f -X GET "$TARGET_URL/health" || echo "Ping dispatched."
